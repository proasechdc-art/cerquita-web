<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menú · Cerquita Domicilios</title>
<style>
:root{--n:#0B2A3D;--g:#1DB954;--bg:#F3F6F8;--t:#14212B;--m:#5B6B77}*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--n);color:#fff;padding:22px 16px 18px}header .w,main{max-width:640px;margin:0 auto}
h1{margin:0 0 4px;font-size:24px}.m{color:#c9d6de;font-size:14px}.ch{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:14px;font-size:13px;font-weight:700}.ok{background:#E3F6EA;color:#12803A}.no{background:#FDE2E2;color:#B3261E}
main{padding:16px}.p{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 3px #0001}
.p img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}.p div{flex:1;min-width:0}.p b{display:block;overflow-wrap:anywhere}.pr{font-weight:800;color:#12803A;white-space:nowrap}
.cta{display:block;text-align:center;background:var(--g);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:14px;margin:18px 0 6px}
.msg{padding:40px 16px;text-align:center;color:var(--m)}.qr{background:#fff;border-radius:16px;padding:22px;text-align:center;margin-bottom:12px}.qr svg{width:min(320px,80vw);height:auto}
.bt{border:0;border-radius:12px;background:var(--n);color:#fff;font:inherit;font-weight:700;padding:12px 18px;cursor:pointer}
@media print{header,.cta,.bt,.noprint{display:none}body{background:#fff}.qr{box-shadow:none}}
</style></head><body>
<header><div class="w"><h1 id="n">Cargando…</h1><div class="m" id="i"></div><span class="ch" id="e" hidden></span></div></header>
<main id="c"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const URL_SB='https://rlaxqsuxemawtiizvicq.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsYXhxc3V4ZW1hd3RpaXp2aWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzI1MjIsImV4cCI6MjEwNjM0ODUyMn0.Ksk2OUtHzACWDOpl6FD26zmR-hnJfiPZCotQCGMpb0Y',PLAY='https://play.google.com/store/apps/details?id=com.proasech.cerquita';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),cop=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const q=new URLSearchParams(location.search),t=q.get('t');
function fail(m){$('#n').textContent='Menú no disponible';$('#c').innerHTML='<div class="msg">'+m+'</div>'}
(async()=>{
 if(!t)return fail('Falta el enlace de la tienda.');
 try{
  const r=await fetch(URL_SB+'/rest/v1/rpc/public_menu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_store:t})});
  const d=await r.json(); if(!r.ok||!d)return fail('No encontramos esta tienda.');
  document.title=d.nombre+' · Menú'; $('#n').textContent=d.nombre; $('#i').textContent=[d.categoria,d.direccion].filter(Boolean).join(' · ');
  const e=$('#e'); e.hidden=false; e.className='ch '+(d.abierto?'ok':'no'); e.textContent=d.abierto?'Abierto ahora':'Cerrado por ahora';
  let h='';
  if(q.get('qr')){h+='<div class="qr"><h2>'+esc(d.nombre)+'</h2><div id="qr"></div><p><b>Escanea para ver nuestro menú</b></p></div><div class="noprint" style="text-align:center"><button class="bt" onclick="print()">Imprimir cartel</button></div>'}
  (d.productos||[]).forEach(p=>{const img=/^https?:\/\//.test(p.imagen||'')?'<img src="'+esc(p.imagen)+'" alt="">':'';h+='<div class="p">'+img+'<div><b>'+esc(p.nombre)+'</b></div><span class="pr">'+cop(p.precio)+'</span></div>'});
  if(!(d.productos||[]).length)h+='<div class="msg">Esta tienda aún no tiene productos.</div>';
  h+='<a class="cta" href="'+PLAY+'">Pide en la app Cerquita Domicilios</a>';
  $('#c').innerHTML=h;
  if(q.get('qr')){try{const x=qrcode(0,'M');x.addData(location.origin+location.pathname+'?t='+encodeURIComponent(t));x.make();$('#qr').innerHTML=x.createSvgTag(8,2)}catch(_){$('#qr').textContent='No se pudo generar el QR. Usa el enlace de esta página.'}}
 }catch(_){fail('No pudimos cargar el menú. Revisa tu conexión.')}
})();
</script></body></html>
