<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Cerquita · Panel de administración</title>
<style>
:root{--navy:#0B2A3D;--green:#1DB954;--orange:#F26B21;--bg:#F4F7F9}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#1b2a33}
[hidden]{display:none!important}
.centro{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:20px}
.caja{background:#fff;border-radius:18px;padding:30px;width:100%;max-width:380px}.caja h1{margin:0 0 4px;color:var(--navy)}.caja p{color:#66757f;margin:0 0 16px}
input,select,button{font:inherit}input,select{width:100%;padding:11px 12px;border:1px solid #CBD5DA;border-radius:10px;margin:6px 0}
button{background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}button.gr{background:#7A8A94}button.rj{background:#D32F2F}button.nv{background:var(--navy)}
button:hover{filter:brightness(1.07)}.err{color:#D32F2F;font-weight:600}
header{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;flex-wrap:wrap;gap:10px}
header b{font-size:20px;font-style:italic}header b span{color:var(--green)}header small{color:#BFD3DD;margin-left:10px}
nav{background:#fff;border-bottom:1px solid #E5E9EC;display:flex;gap:4px;padding:0 14px;overflow-x:auto}
nav a{padding:13px 14px;cursor:pointer;color:#445;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}nav a.on{color:var(--navy);border-color:var(--green)}
main{padding:20px;max-width:1200px;margin:0 auto}h2{margin:4px 0 14px;color:var(--navy)}h3{margin:24px 0 10px;color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:#fff;border:1px solid #E5E9EC;border-radius:14px;padding:16px}.kpi .v{font-size:26px;font-weight:800;color:var(--navy)}.kpi .t{color:#66757f}.kpi .s{font-size:12px;color:#99a}
.tw{overflow-x:auto;background:#fff;border:1px solid #E5E9EC;border-radius:14px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid #EEF1F3;white-space:nowrap}th{background:#F7F9FA;color:#556}
.barra{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.barra input,.barra select{width:auto;flex:1;min-width:160px;margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#fff;border:1px solid #E5E9EC;border-radius:20px;padding:6px 12px}
.mut{color:#66757f}.card{background:#fff;border:1px solid #E5E9EC;border-radius:14px;padding:16px;margin-bottom:12px}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.fila label{display:block;font-size:13px;color:#556}.fila input,.fila select{width:auto;min-width:140px}
.aviso{position:fixed;top:14px;right:14px;padding:12px 16px;border-radius:12px;color:#fff;font-weight:600;z-index:9;max-width:340px}.aviso.ok{background:var(--green)}.aviso.mal{background:#D32F2F}
small.h{font-weight:400;color:#66757f}
</style></head><body>
<div id="aviso" class="aviso" hidden></div>
<div id="login" class="centro"><form class="caja" id="fl"><h1>Cerquita</h1><p>Panel de administración</p>
<input id="em" type="email" placeholder="Correo" autocomplete="username" required><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" required>
<button style="width:100%;margin-top:8px">Entrar</button><p id="le" class="err"></p></form></div>
<div id="app" hidden><header><div><b>Cer<span>quita</span></b><small>Panel de administración</small></div><div><small id="quien"></small> <button class="gr" id="salir">Salir</button></div></header><nav id="tabs"></nav><main id="vista"></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="panel.js"></script></body></html>
